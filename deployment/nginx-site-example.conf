# Example Nginx server block — adjust paths, domain, and SSL paths (Certbot).
# Professor requirements: HTTPS, 301 HTTP→HTTPS, /api/chat proxied (not exposing Node port publicly).

# Redirect HTTP → HTTPS (Certbot often adds this automatically)
# server {
#   listen 80;
#   listen [::]:80;
#   server_name yourdomain.com www.yourdomain.com;
#   return 301 https://$host$request_uri;
# }

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name yourdomain.com www.yourdomain.com;

    # ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    root /var/www/portfolio;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
